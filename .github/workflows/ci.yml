name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --workspace

  provenance:
    runs-on: ubuntu-latest
    permissions:
      attestations: read
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: stellar/stellar-cli@v27.0.0
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32v1-none
      - name: Build provenance manifest (two clean reproducible builds)
        run: pwsh scripts/build-release.ps1 -ReproducibilityChecks 2 -Output artifacts/provenance.json
      - name: Verify WASM artifacts match provenance
        run: pwsh scripts/verify-provenance.ps1 -Provenance artifacts/provenance.json
      - name: Run hash-tampering and stale-artifact tests
        run: pwsh scripts/test-provenance.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: provenance-manifest
          path: artifacts/provenance.json
